name: dependencies-meta
buildsystem: simple
build-commands:
  - true
modules:
  - name: zig
    buildsystem: simple
    cleanup:
      - "*"
    build-commands:
      - mkdir -p /app/zig
      - cp -r ./* /app/zig
      - chmod a+x /app/zig/zig
    sources:
      - type: archive
        sha256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
        url: https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
        only-arches: [x86_64]
      - type: archive
        sha256: ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17
        url: https://ziglang.org/download/0.16.0/zig-aarch64-linux-0.16.0.tar.xz
        only-arches: [aarch64]

  - name: bzip2-redirect
    buildsystem: simple
    build-commands:
      - install -Dm644 libbzip2.so /app/lib/libbzip2.so
    sources:
      - type: inline
        contents: INPUT(libbz2.so)
        dest-filename: libbzip2.so

  - name: gtk4-layer-shell
    buildsystem: meson
    sources:
      # no x-checker-data since this should be synchronized with Nix
      #
      # TODO: Automate this with check-zig-cache.sh
      - type: archive
        url: https://github.com/wmww/gtk4-layer-shell/archive/refs/tags/v1.3.0.tar.gz
        sha256: 1ebb01ab14e98afd1727f68f64981c37bd23305b1f131f5667c02b94cf593192

  - name: pandoc
    buildsystem: simple
    cleanup:
      - "*"
    build-commands:
      - install -Dm755 bin/pandoc /app/bin/pandoc
    sources:
      - type: archive
        sha256: 37edb3bbcf722f921a009941bf5874e2e0c09263226c9b4a2d980788cb062ab6
        url: https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-linux-amd64.tar.gz
        only-arches: [x86_64]
        x-checker-data:
          type: json
          url: https://api.github.com/repos/jgm/pandoc/releases/latest
          url-query:
            .assets[] | select(.name=="pandoc-" + $version + "-linux-amd64.tar.gz")
            | .browser_download_url
          version-query: .tag_name
      - type: archive
        sha256: 56ed5566ec41d22ec9ee0704e6ac0b98ba102e92384efd5306173a22d314c79a
        url: https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-linux-arm64.tar.gz
        only-arches: [aarch64]
        x-checker-data:
          type: json
          url: https://api.github.com/repos/jgm/pandoc/releases/latest
          url-query:
            .assets[] | select(.name=="pandoc-" + $version + "-linux-arm64.tar.gz")
            | .browser_download_url
          version-query: .tag_name

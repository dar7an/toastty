name: Ghostty upstream report
on:
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: toastty-upstream-report
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare the adopted engine with upstream
        run: |
          python3 scripts/upstream.py report --output "$RUNNER_TEMP/upstream-report.md"
          cat "$RUNNER_TEMP/upstream-report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve upstream report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ghostty-upstream-report
          path: ${{ runner.temp }}/upstream-report.md
          retention-days: 90

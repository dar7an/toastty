name: Toastty macOS
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: toastty-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
      - name: Install macOS development tools
        run: brew install nushell swiftlint
      - name: Verify bundled notices
        run: |
          python3 scripts/bundle-notices.py
          git diff --exit-code -- macos/Sources/ThirdPartyNotices.txt
          git diff --check
      - name: Build and run unit tests
        run: scripts/test.sh
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-test-results
          path: ~/Library/Developer/Xcode/DerivedData/Ghostty-*/Logs/Test/*.xcresult
          if-no-files-found: warn
